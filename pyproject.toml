[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fingraph"
version = "0.1.0"
description = "FinGraph Razorpay Test Mode connectivity milestone"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
